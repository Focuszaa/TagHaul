services:
  taghaul:
    image: nirutfcz/taghual:0.4.0
    platform: ${TAGHAUL_PLATFORM:-linux/amd64}
    container_name: taghaul
    restart: unless-stopped
    environment:
      PHOTO_TAGGER_DASHBOARD_ROOT: /volume1/Photos
      PHOTO_TAGGER_DB_PATH: /data/indexing.db
      PHOTO_TAGGER_SETTINGS_PATH: /data/tagger_settings.json
      PHOTO_TAGGER_HOST: 0.0.0.0
      PHOTO_TAGGER_PORT: "5000"
      PHOTO_TAGGER_MAX_WORKERS: "2"
      OLLAMA_HOST: http://192.168.1.1:11434
    ports:
      - "5050:5000"
    volumes:
      - "/volume1/docker/taghaul:/data"
      - "/volume1/homes/ford/Photos:/volume1/Photos:rw"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
